name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.4.20

      - name: Install build deps
        run: uv pip install build --system

      - name: Build wheel and sdist
        run: python -m build

      - name: Store dist packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # Publishing to PyPI is OPT-IN. It stays skipped until a trusted publisher exists for this repo on
  # PyPI (PyPI → project → Publishing → add publisher: repository=AnnasMazhar/factorproof,
  # workflow=release.yml, environment=pypi). Until that exists the job fails with
  # `invalid-publisher`, which turns every tag red for a pure configuration reason.
  # Enable it by setting the repository variable PYPI_PUBLISH=true (Settings → Secrets and
  # variables → Actions → Variables).
  publish-to-pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/factor-lab
    permissions:
      id-token: write  # trusted publishing — no PYPI_TOKEN secret needed

    steps:
      - name: Download dist packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
