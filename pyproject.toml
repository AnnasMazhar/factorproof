[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-lab"
version = "0.1.0"
description = "Evidence-gated factor research engine for financial time series"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pyyaml>=6.0.2",
    "matplotlib>=3.8.4",
]
keywords = [
    "quantitative-finance",
    "factor-investing",
    "alpha-research",
    "backtesting",
    "statistics",
    "multiple-testing",
    "purged-cross-validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AnnasMazhar/factor-lab"
Repository = "https://github.com/AnnasMazhar/factor-lab"
Issues = "https://github.com/AnnasMazhar/factor-lab/issues"
Changelog = "https://github.com/AnnasMazhar/factor-lab/blob/main/CHANGELOG.md"

[project.scripts]
factor-lab = "factorlab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
    "mutmut==2.4.4",
    "ruff==0.4.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
